<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>パーティクルデモ</title>
    <style>
      :root {
        --bg: #06080f;
        --panel: rgba(18, 24, 40, 0.72);
        --border: rgba(120, 160, 255, 0.22);
        --text: #e6ecff;
        --muted: #8b97bd;
        --accent: #5e8bff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          'Hiragino Kaku Gothic ProN',
          'Noto Sans JP',
          sans-serif;
      }

      #scene {
        position: fixed;
        inset: 0;
        display: block;
        cursor: crosshair;
      }

      .panel {
        position: fixed;
        top: 16px;
        left: 16px;
        width: 264px;
        max-width: calc(100vw - 32px);
        padding: 18px 18px 16px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 14px;
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
        z-index: 10;
        user-select: none;
        transition:
          transform 0.3s ease,
          opacity 0.3s ease;
      }

      .panel.collapsed {
        transform: translateX(calc(-100% - 16px));
        opacity: 0;
      }

      .panel h1 {
        margin: 0 0 2px;
        font-size: 17px;
        letter-spacing: 0.02em;
      }

      .panel p.sub {
        margin: 0 0 16px;
        font-size: 12px;
        color: var(--muted);
        line-height: 1.5;
      }

      .control {
        margin-bottom: 14px;
      }

      .control label {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 6px;
      }

      .control label .val {
        color: var(--text);
        font-variant-numeric: tabular-nums;
      }

      input[type='range'] {
        width: 100%;
        accent-color: var(--accent);
      }

      .palette {
        display: flex;
        gap: 8px;
        margin: 4px 0 4px;
      }

      .swatch {
        flex: 1;
        height: 26px;
        border-radius: 7px;
        border: 2px solid transparent;
        cursor: pointer;
        transition:
          transform 0.12s ease,
          border-color 0.12s ease;
      }

      .swatch:hover {
        transform: translateY(-2px);
      }

      .swatch.active {
        border-color: #fff;
      }

      .btn-row {
        display: flex;
        gap: 8px;
        margin-top: 4px;
      }

      button {
        flex: 1;
        padding: 8px 10px;
        font-size: 12px;
        color: var(--text);
        background: rgba(94, 139, 255, 0.16);
        border: 1px solid var(--border);
        border-radius: 8px;
        cursor: pointer;
        transition: background 0.15s ease;
      }

      button:hover {
        background: rgba(94, 139, 255, 0.3);
      }

      .toggle {
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 11;
        width: 40px;
        height: 40px;
        padding: 0;
        flex: none;
        font-size: 18px;
        line-height: 1;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
      }

      .toggle.show {
        opacity: 1;
        pointer-events: auto;
      }

      .hint {
        position: fixed;
        bottom: 14px;
        right: 16px;
        font-size: 11px;
        color: var(--muted);
        z-index: 10;
        user-select: none;
      }

      .fps {
        position: fixed;
        bottom: 14px;
        left: 16px;
        font-size: 11px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        z-index: 10;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>

    <button class="toggle" id="toggle" title="パネルを開く">☰</button>

    <section class="panel" id="panel">
      <h1>パーティクルデモ</h1>
      <p class="sub">
        マウスで粒子を引き寄せ、クリックで弾き飛ばします。Canvas 2D による軽量な実装です。
      </p>

      <div class="control">
        <label>粒子数 <span class="val" id="countVal">160</span></label>
        <input type="range" id="count" min="20" max="400" step="10" value="160" />
      </div>

      <div class="control">
        <label>接続距離 <span class="val" id="linkVal">120</span></label>
        <input type="range" id="link" min="0" max="240" step="10" value="120" />
      </div>

      <div class="control">
        <label>速度 <span class="val" id="speedVal">1.0</span></label>
        <input type="range" id="speed" min="0" max="30" step="1" value="10" />
      </div>

      <div class="control">
        <label>マウス引力 <span class="val" id="gravVal">0.8</span></label>
        <input type="range" id="grav" min="0" max="20" step="1" value="8" />
      </div>

      <div class="control">
        <label>カラー</label>
        <div class="palette" id="palette"></div>
      </div>

      <div class="btn-row">
        <button id="burst">バースト</button>
        <button id="reset">リセット</button>
      </div>
    </section>

    <div class="fps" id="fps">– fps</div>
    <div class="hint">移動：引力 / クリック：反発</div>

    <script>
      const canvas = document.getElementById('scene');
      const ctx = canvas.getContext('2d');

      const palettes = [
        { name: 'ocean', from: [94, 139, 255], to: [80, 230, 220] },
        { name: 'sunset', from: [255, 120, 90], to: [255, 200, 80] },
        { name: 'neon', from: [200, 90, 255], to: [90, 255, 170] },
        { name: 'mono', from: [200, 210, 235], to: [120, 135, 175] },
      ];

      const config = {
        count: 160,
        link: 120,
        speed: 1.0,
        grav: 0.8,
        palette: 0,
      };

      const mouse = { x: -9999, y: -9999, active: false };
      let particles = [];
      let dpr = 1;
      let width = 0;
      let height = 0;

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function rand(min, max) {
        return min + Math.random() * (max - min);
      }

      function makeParticle(x, y) {
        const angle = rand(0, Math.PI * 2);
        const sp = rand(0.2, 1) * config.speed;
        return {
          x: x ?? rand(0, width),
          y: y ?? rand(0, height),
          vx: Math.cos(angle) * sp,
          vy: Math.sin(angle) * sp,
          r: rand(1.2, 3.2),
          t: Math.random(),
        };
      }

      function buildParticles() {
        particles = Array.from({ length: config.count }, () => makeParticle());
      }

      function lerpColor(a, b, t) {
        return [
          Math.round(a[0] + (b[0] - a[0]) * t),
          Math.round(a[1] + (b[1] - a[1]) * t),
          Math.round(a[2] + (b[2] - a[2]) * t),
        ];
      }

      function colorFor(t, alpha) {
        const pal = palettes[config.palette];
        const c = lerpColor(pal.from, pal.to, t);
        return `rgba(${c[0]}, ${c[1]}, ${c[2]}, ${alpha})`;
      }

      let last = performance.now();
      let fpsSmooth = 60;

      function step(now) {
        const dt = Math.min((now - last) / 16.667, 3);
        last = now;
        fpsSmooth += (1000 / Math.max(now - (step.prev || now), 1) - fpsSmooth) * 0.1;
        step.prev = now;

        ctx.clearRect(0, 0, width, height);
        ctx.fillStyle = 'rgba(6, 8, 15, 0.32)';
        ctx.fillRect(0, 0, width, height);

        const linkDist = config.link;
        const linkSq = linkDist * linkDist;

        for (const p of particles) {
          if (mouse.active) {
            const dx = mouse.x - p.x;
            const dy = mouse.y - p.y;
            const d2 = dx * dx + dy * dy;
            if (d2 < 260 * 260 && d2 > 1) {
              const d = Math.sqrt(d2);
              const force = (config.grav * 0.06) / d;
              p.vx += dx * force * dt;
              p.vy += dy * force * dt;
            }
          }

          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.vx *= 0.99;
          p.vy *= 0.99;

          if (p.x < 0) {
            p.x = 0;
            p.vx *= -1;
          } else if (p.x > width) {
            p.x = width;
            p.vx *= -1;
          }
          if (p.y < 0) {
            p.y = 0;
            p.vy *= -1;
          } else if (p.y > height) {
            p.y = height;
            p.vy *= -1;
          }
        }

        // links
        if (linkDist > 0) {
          for (let i = 0; i < particles.length; i++) {
            const a = particles[i];
            for (let j = i + 1; j < particles.length; j++) {
              const b = particles[j];
              const dx = a.x - b.x;
              const dy = a.y - b.y;
              const d2 = dx * dx + dy * dy;
              if (d2 < linkSq) {
                const alpha = (1 - d2 / linkSq) * 0.5;
                ctx.strokeStyle = colorFor((a.t + b.t) / 2, alpha);
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(a.x, a.y);
                ctx.lineTo(b.x, b.y);
                ctx.stroke();
              }
            }
          }
        }

        // particles
        for (const p of particles) {
          ctx.fillStyle = colorFor(p.t, 0.9);
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();
        }

        requestAnimationFrame(step);
      }

      function burst() {
        const cx = mouse.active ? mouse.x : width / 2;
        const cy = mouse.active ? mouse.y : height / 2;
        for (const p of particles) {
          const dx = p.x - cx;
          const dy = p.y - cy;
          const d = Math.max(Math.sqrt(dx * dx + dy * dy), 1);
          const power = rand(4, 9);
          p.vx += (dx / d) * power;
          p.vy += (dy / d) * power;
        }
      }

      // --- controls ---
      function bindRange(id, valId, key, format) {
        const input = document.getElementById(id);
        const out = document.getElementById(valId);
        const apply = () => {
          let v = Number(input.value);
          if (key === 'speed' || key === 'grav') v = v / 10;
          config[key] = v;
          out.textContent = format ? format(v) : v;
          if (key === 'count') buildParticles();
        };
        input.addEventListener('input', apply);
        apply();
      }

      bindRange('count', 'countVal', 'count');
      bindRange('link', 'linkVal', 'link');
      bindRange('speed', 'speedVal', 'speed', (v) => v.toFixed(1));
      bindRange('grav', 'gravVal', 'grav', (v) => v.toFixed(1));

      // palette swatches
      const paletteEl = document.getElementById('palette');
      palettes.forEach((pal, i) => {
        const sw = document.createElement('div');
        sw.className = 'swatch' + (i === config.palette ? ' active' : '');
        sw.style.background = `linear-gradient(135deg, rgb(${pal.from.join(',')}), rgb(${pal.to.join(',')}))`;
        sw.title = pal.name;
        sw.addEventListener('click', () => {
          config.palette = i;
          paletteEl
            .querySelectorAll('.swatch')
            .forEach((s, k) => s.classList.toggle('active', k === i));
        });
        paletteEl.appendChild(sw);
      });

      document.getElementById('burst').addEventListener('click', burst);
      document.getElementById('reset').addEventListener('click', buildParticles);

      // panel collapse
      const panel = document.getElementById('panel');
      const toggle = document.getElementById('toggle');
      panel.addEventListener('dblclick', () => {
        panel.classList.add('collapsed');
        toggle.classList.add('show');
      });
      toggle.addEventListener('click', () => {
        panel.classList.remove('collapsed');
        toggle.classList.remove('show');
      });

      // pointer
      function setMouse(e) {
        const t = e.touches ? e.touches[0] : e;
        mouse.x = t.clientX;
        mouse.y = t.clientY;
        mouse.active = true;
      }
      window.addEventListener('pointermove', setMouse);
      window.addEventListener('pointerdown', (e) => {
        setMouse(e);
        if (e.target === canvas) burst();
      });
      window.addEventListener('pointerleave', () => (mouse.active = false));

      // fps readout
      const fpsEl = document.getElementById('fps');
      setInterval(() => {
        fpsEl.textContent = Math.round(fpsSmooth) + ' fps';
      }, 500);

      window.addEventListener('resize', resize);
      resize();
      buildParticles();
      requestAnimationFrame(step);
    </script>
  </body>
</html>
